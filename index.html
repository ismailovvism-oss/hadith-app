 const shelves=CFG.collections.map(c=>`<a class="shelf" href="#/${c.id}"><b>${esc(c.ru)}</b><span class="a" lang="ar" dir="rtl">${esc(c.ar)}</span>

async function osnovy(){bar('Пятьдесят основ','#/');const p=await J('data/osnovy.json'),bu=p.filter(z=>z.k.startsWith('bukhari-')).length;

/* Чтение книги: главы и хадисы одной лентой */
const nameOf=(id,names)=>{const v=names[id];if(!v)return null;return v[0]?{t:v[0],ar:0,lv:v[2]}:{t:v[1],ar:1,lv:v[2]}};
function chip(id,names){const n=nameOf(id,names);if(!n)return '';return `<a class="ch l${n.lv}" data-id="${id}"${n.ar?' lang="ar" dir="rtl"':''}>${esc(n.t)}</a>`}
function chainBox(h,names){if(!ST.isnad||!h.c||!h.c.length||!h.c[0].length)return '';
 const last=nameOf(h.c[0].at(-1),names);
 const rows=h.c.map(c=>`<div class="chain"><span class="ch ch-p">Аль-Бухари</span>${c.map(i=>{const s=chip(i,names);return s?'<i>от</i>'+s:''}).join('')}${h.p?'<i>от</i><span class="ch ch-p">Пророк ﷺ</span>':''}</div>`).join('');
 return `<details class="d"><summary>Передатчик: <b${last&&last.ar?' lang="ar"':''}>${esc(last?last.t:'')}</b></summary>${rows}</details>`}
function arBlock(h){const parts=`<p class="isnad">${h.i}</p><p class="matn">${h.x}</p>${h.z?`<p class="isnad">${h.z}</p>`:''}`;
 return `<section class="ar" lang="ar" dir="rtl">${foldBox(parts,wc([h.x]),200)}</section>`}
function hadith(h,c,tg){const show=ST.ru&&h.ru,vis=show||ST.ar||h.n===tg;if(!vis)return '';
 const adr=`${c}/${BOOK.n}/${h.n}`;
 const head=h.t?`<h4${edA(adr+'/t')}>${esc(edTitle(adr+'/t',h.t))}${pen(adr+'/t')}</h4>`:`<h4 class="tar" lang="ar" dir="rtl">${esc(h.tar||'')}</h4>`;
 const fn=h.fn?`<div class="fn">${h.fn.map((f,i)=>edBlock(`${adr}/fn/${i}`,f)).join('')}</div>`:'';
 const tr=show?`<div class="tr">${foldBox(h.ru.map((p,i)=>edBlock(`${adr}/ru/${i}`,p)).join('')+fn,ED.on||h.n===tg?0:wc(h.ru))}</div>`:(h.ru?'':'<p class="intro">Перевод этого хадиса готовится.</p>');
 const ar=ST.ar||!h.ru?arBlock(h):'';
 const sh=ST.sharh&&h.s?`<section class="sh" data-k="${c}-${h.n}"${h.n===tg?' data-full="1"':''}><p class="lb">Ясный шарх</p><div class="bd">Загружается…</div></section>`:'';
 return `<article class="h" id="h${esc(h.n)}"><p class="n">№ ${esc(h.n)}</p>${head}${tr}${ar}${chainBox(h,BOOK.names)}${sh}${qBox(c+'-'+h.n)}
 <details class="d" data-oth="${esc(h.n)}" data-c="${c}"><summary>Другие передачи этого хадиса</summary><div class="oth">Загружается…</div></details>
 <div class="acts"><button class="more" data-link="#/${c}/${BOOK.n}/${esc(h.n)}">Скопировать ссылку</button></div></article>`}
function chapter(ch,c,tg,ci){const hs=ch.h.map(h=>hadith(h,c,tg)).join('');
 const cad=`${c}/${BOOK.n}/ch/${ci}`;
 const showHead=hs||(ST.ar&&(ch.ar||ch.ai))||ch.intro&&ch.intro.length&&ST.ru;if(!showHead)return '';
 const ttl=ch.ru||ED.on&&SRC&&SRC.ch[ci]?`<h3${edA(cad+'/t')}>${esc(edTitle(cad+'/t',ch.ru)).replace(/\[\^(\w+)\]/g,'<sup>$1</sup>')||'Без названия'}${pen(cad+'/t')}</h3>`:(ch.ar==='باب'||!ch.ar?'':`<p class="bab" lang="ar" dir="rtl">${esc(ch.ar)}</p>`);
 const arT=ch.ru&&ST.ar&&ch.ar&&ch.ar!=='باب'?`<p class="bab" lang="ar" dir="rtl">${esc(ch.ar)}</p>`:'';
 const intro=ch.intro&&ch.intro.length?`<div class="intro">${ch.intro.map((p,i)=>edBlock(`${cad}/intro/${i}`,p)).join('')}</div>`:'';
 const cfn=ch.fn?`<div class="fn">${ch.fn.map((f,i)=>edBlock(`${cad}/fn/${i}`,f)).join('')}</div>`:'';
 return `<section class="chap"><p class="lb">Глава</p>${ttl}${arT}${intro}${cfn}</section>${hs}`}
async function book(c,n,tg,qa){if(tg&&tg.startsWith('q-')){qa=tg;tg=null}const col=CFG.collections.find(x=>x.id===c);let b;
 try{b=await J(`data/${c}/${pad(n)}.json`)}catch{return notfound()}

 const pv=near(-1),nx=near(1);
 view.innerHTML=`<div class="bk"><p class="n">${esc(col.ru)} · книга ${n}</p><h2>${esc(b.ru)}</h2><p class="a" lang="ar" dir="rtl">${esc(b.ar)}</p></div>
 ${ED.on?edBar():''}${body||`<div class="empty">Эта книга ещё не переведена.<br><button class="btn" data-ar>Показать на арабском</button></div>`}${qs}
 <nav class="pn">${pv?`<a class="btn" href="#/${c}/${pv.n}">← ${esc(pv.ru)}</a>`:'<span></span>'}${nx?`<a class="btn" href="#/${c}/${nx.n}">${esc(nx.ru)} →</a>`:''}</nav>`;

 if(tg){const t=document.getElementById('h'+tg);if(t)t.scrollIntoView()}

/* Статьи шарха подгружаются, только когда до них дошли */
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fillSharh(e.target)}}),{rootMargin:'400px'}):null;
function watchSharh(){document.querySelectorAll('.sh[data-k]').forEach(s=>io?io.observe(s):fillSharh(s))}
async function fillSharh(s){try{const a=await J(`data/sharh/${s.dataset.k}.json`);
 const bd=s.querySelector('.bd');bd.innerHTML=foldBox(a.html,ED.on||s.dataset.full?0:a.html.replace(/<[^>]+>/g,' ').trim().split(/\s+/).length);
 if(ED.on)bd.querySelectorAll('p,li').forEach((p,i)=>{const ad=`sharh/${s.dataset.k}/${i}`;p.dataset.ed=ad;p.dataset.note=1;p.insertAdjacentHTML('beforeend',pen(ad));p.insertAdjacentHTML('afterend',noteLine(ad))})}catch{s.querySelector('.bd').textContent='Не удалось загрузить статью.'}}

async function fillOther(d){const c=d.dataset.c;const box=d.querySelector('.oth');
 try{const t=await J(`data/${c}/${pad(BOOK.n)}.t.json`),o=t[d.dataset.oth],titles=await J(`data/${c}/titles.json`);

/* Передатчик */
const YES=/^\d+$/;
const person=(x)=>{const[id,ru,ar]=x,t=ru||ar,cl=ru?'':' lang="ar" dir="rtl"';return id?`<a data-id="${id}"${cl}>${esc(t)}</a>`:`<span${cl}>${esc(t)}</span>`};
async function fetchNarrator(id){const ch=await J(`data/r/${Math.floor(id/100)}.json`);return ch[id]}
async function narratorHTML(n){
 const facts=[n.death?`ум. ${n.death} г. х.`:'',n.tab&&n.lv!=6?`ступень ${n.tab}`:'',n.total?`хадисов и преданий в базе: ${fmt(n.total)}`:''].filter(Boolean).join(' · ');
 let list='';
 for(const col of CFG.collections){const nums=n.h[col.id]||[];if(!nums.length)continue;
  const titles=await J(`data/${col.id}/titles.json`);
  const rows=nums.filter(x=>titles[x]&&(titles[x][1]||ST.ar));
  const rest=nums.length-rows.length;
  list+=`<h4>Что передал: ${esc(col.ru)}, ${fmt(nums.length)}</h4><ul>${rows.slice(0,50).map(x=>{const t=titles[x];return `<li><a href="#/${col.id}/${t[0]}/${x}"><small>№ ${x}</small>${t[1]?esc(t[1]):`<span lang="ar" dir="rtl" style="font:400 17px var(--ar)">${esc(t[2])}</span>`}</a></li>`}).join('')}</ul>
  ${rows.length>50?`<p>И ещё ${fmt(rows.length-50)}.</p>`:''}${rest&&!ST.ar?`<p>Без перевода пока ${fmt(rest)}. С арабским текстом виден весь список.</p>`:''}`}
 return `<h3>${esc(n.ru||n.ar)}</h3>${n.ru?`<div class="arn" lang="ar">${esc(n.ar)}</div>`:''}
 <span class="g l${n.lv}">${esc(n.g)}</span><p>${esc(facts)}</p>${list}
 ${n.te.length?`<h4>Учителя</h4><div class="tt">${n.te.map(person).join('')}</div>`:''}
 ${n.st.length?`<h4>Ученики</h4><div class="tt">${n.st.map(person).join('')}</div>`:''}
 ${n.books.length?`<h4>В каких сборниках</h4><p>${n.books.map(b=>`${esc(b[1])} (${b[2]})`).join(' · ')}</p>`:''}
 <details class="d"><summary>Слова критиков на арабском</summary>
 ${n.ih?`<div class="q"><small>Ибн Хаджар</small>${esc(n.ih)}</div>`:''}${n.dh?`<div class="q"><small>Аз-Захаби</small>${esc(n.dh)}</div>`:''}
 ${n.crit.map(c=>`<div class="q"><small>${esc(c[0])}</small>${esc(c[1])}</div>`).join('')}
 ${n.src.length?`<div class="q"><small>Где статья о нём</small>${n.src.map(s=>`${esc(s[0])} ${s[1]?s[1]+'/':''}${s[2]||''}`).join(' · ')}</div>`:''}</details>`}

/* Поиск */
const normRu=s=>s.toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();
const normAr=s=>s.replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
function snippet(t,q,i){const a=Math.max(0,i-60);return esc(t.slice(a,i))+'<b>'+esc(t.slice(i,i+q.length))+'</b>'+esc(t.slice(i+q.length,i+q.length+90))}
async function searchPage(q){bar('Поиск','#/');
 view.innerHTML=`<form class="sf" id="sf"><input type="search" name="q" value="${esc(q)}" placeholder="Слово из хадиса или имя передатчика" aria-label="Поиск" autofocus><button class="ib" aria-label="Найти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></form><div id="res"></div>`;
 if(q.trim().length<2){$('res').innerHTML='<p class="intro">Ищет по переводу и именам. Если написать по-арабски, ищет по арабскому тексту всего сборника.</p>';return}
 const isAr=/[؀-ۿ]/.test(q),nq=isAr?normAr(q):normRu(q);let html='';
 const ppl=(await J('data/narrators.json')).filter(p=>(isAr?normAr(p[2]):normRu(p[1])).includes(nq)).slice(0,10);
 if(ppl.length)html+=`<h2 class="sec">Передатчики</h2><ul class="list">${ppl.map(p=>`<li><a href="#/r/${p[0]}"><span class="t"${p[1]?'':' lang="ar" dir="rtl"'}>${esc(p[1]||p[2])}</span></a></li>`).join('')}</ul>`;
 for(const c of CFG.collections){const idx=await J(`data/${c.id}/search-${isAr?'ar':'ru'}.json`),titles=await J(`data/${c.id}/titles.json`);
  const low=s=>isAr?s:s.toLowerCase().replace(/ё/g,'е');
  const hits=idx.map(x=>[x[0],x[1],low(x[1]).indexOf(nq)]).filter(x=>x[2]>=0);
  if(hits.length)html+=`<h2 class="sec">${esc(c.ru)}: ${fmt(hits.length)}</h2><ul class="list res">${hits.slice(0,60).map(x=>{const t=titles[x[0]];return `<li><a href="#/${c.id}/${t[0]}/${x[0]}"><span class="no">${x[0]}</span><span class="t">${esc(t[1]||t[2])}<span class="sn${isAr?' ars':''}">${snippet(x[1],nq,x[2])}</span></span></a></li>`}).join('')}</ul>`}
 $('res').innerHTML=html||'<p class="empty">Ничего не нашлось.</p>'}

function about(){bar('О приложении','#/');view.innerHTML=`<div class="intro" style="color:var(--fg)">
 <p><strong>Библиотека хадисов</strong> устроена как «Библиотека тафсиров»: хадис занимает место аята, а к нему подключаются источники. Выбрать их можно кнопкой настроек вверху.</p>
 <p><strong>Перевод и Ясный шарх</strong> наши. Перевод держится текста, шарх объясняет его живым языком по «Фатх аль-Бари» Ибн Хаджара и другим шархам. Работа идёт книга за книгой.</p>
 <p><strong>Пятьдесят основ</strong> — хадисы, на которых держится религия, в порядке «Джами аль-улюм валь-хикам» Ибн Раджаба: сорок два из «Сорока хадисов» ан-Навави и восемь, что добавил Ибн Раджаб. Его разбор здесь главный, где хадиса нет у аль-Бухари.</p>
 <p><strong>Арабский текст, цепочки и другие передачи:</strong> hadith.dev (جامع خادم الحرمين الشريفين).</p>
 <p><strong>Сведения о передатчиках:</strong> наша база по книгам риджаля.</p>
 <p><strong>Другие наши приложения и книги:</strong> <a href="https://tawhiid.com" target="_blank" rel="noopener">tawhiid.com</a></p></div>`}
const notfound=()=>{view.innerHTML='<div class="empty">Такой страницы нет.<br><a class="btn" href="#/">На главную</a></div>'};

/* Вопросы хозяину (data/questions.json из ясный-шарх/вопросы-хозяину.md и вопросов переводчика): в режиме редактора
   под шархом своего хадиса, в конце книги (вопросы без номера хадиса) и списком на #/questions. Ответ — правка «q/<id>». */
let QI=null;
async function qIndex(){if(QI)return QI;const all=await J('data/questions.json'),by={},bk={};
 for(const q of all){for(const k of q.h)(by[k]??=[]).push(q);if(!q.h.length&&q.a[0])(bk[q.a[0]]??=[]).push(q)}
 return QI={all,by,book:bk}}
const qAns=q=>{const r=edGet('q/'+q.id);return !!(r&&(r.note||r.st==='ok'))};
const qPlace=a=>{const p=a.split('/');return p[0]==='osnovy'?`основа ${p[1]}`:p[2]?`№ ${p[2]}`:`книга ${p[1]}`};
function qItem(q,here){const r=edGet('q/'+q.id),st=!r?'ждёт ответа':r.st==='ok'?'учтено':'ответ отправлен';
 const to=here?'':q.a.map(x=>`<a href="#/${x}/q-${q.id}">${qPlace(x)}</a>`).join(', ');
 return `<div class="qi${r?(r.st==='ok'?' ok':' has'):''}" id="q-${q.id}"><p class="qc">${q.s==='перевод'?'Перевод':'Шарх'} · ${esc(q.c)} · <b>${st}</b></p>
 ${q.l?`<p class="ql">${q.l}</p>`:''}<p class="qt">${q.t}</p>${r&&r.note?`<div class="ednote">Ваш ответ: ${esc(r.note)}</div>`:''}${r&&r.reply?`<div class="ednote">Claude: ${esc(r.reply)}</div>`:''}
 <div class="qr">${to?`<span class="qto">К месту: ${to}</span>`:''}<button class="more" data-ask="${q.id}">${r&&r.note?'Изменить ответ':'Ответить'}</button></div></div>`}
function qBox(k){const l=ED.on&&QI&&QI.by[k];return l?`<section class="qbox"><p class="lb">Вопросы к вам · ${l.length}</p>${l.map(q=>qItem(q,1)).join('')}</section>`:''}
async function goQ(id){const el=$(id);if(!el)return;const s=el.closest('article')?.querySelector('.sh[data-k]');
 if(s){io&&io.unobserve(s);await fillSharh(s)}el.scrollIntoView();el.classList.add('flash')}
function openAsk(id){const q=QI&&QI.all.find(x=>x.id===id);if(!q)return;const a='q/'+id,r=edGet(a),plain=s=>s.replace(/<[^>]+>/g,'');
 $('sheet').innerHTML=`<h3>Ответ на вопрос</h3><div class="orig">${q.l?q.l+' ':''}${q.t}</div>
 <label for="edn2">Ваш ответ</label><textarea id="edn2" class="nt">${escP(r?r.note||'':'')}</textarea>
 <div class="row"><button class="btn pri" data-edsave="${esc(a)}">Сохранить</button><button class="btn" data-edclose>Отмена</button>${r?`<button class="more" data-eddel="${esc(a)}">Убрать ответ</button>`:''}</div>`;
 $('sheet').dataset.src=`[${q.a.join(', ')}] ${q.l?plain(q.l)+' ':''}${plain(q.t)}`;$('sheet').hidden=false;$('scrim').hidden=false;$('edn2').focus()}
const QTABS=[['sharh','Шарх',q=>q.s==='шарх'&&!qAns(q)],['perevod','Перевод',q=>q.s==='перевод'&&!qAns(q)],['answered','С ответом',qAns],['all','Все',()=>true]];
async function questionsPage(f){bar('Вопросы','#/');if(!ED.on)return notfound();await edSync();const{all}=await qIndex();
 const tab=QTABS.find(x=>x[0]===f)||QTABS[0],list=all.filter(tab[2]);let g='',html='';
 for(const q of list){if(q.g!==g){g=q.g;html+=`<h2 class="sec">${esc(g)}</h2>`}html+=qItem(q,0)}
 view.innerHTML=`<div class="bk"><h2>Вопросы к вам</h2></div><p class="intro">Ответ можно дать здесь или под шархом хадиса: ссылка «К месту» ведёт к вопросу. Скажите Claude «забери ответы», и он внесёт их и ответит.</p>
 <nav class="tabs">${QTABS.map(x=>`<a href="#/questions/${x[0]}"${x===tab?' class="on"':''}>${x[1]} ${fmt(all.filter(x[2]).length)}</a>`).join('')}</nav>
 <div class="qbox" style="padding-top:4px">${html||'<p class="intro">Здесь пусто.</p>'}</div>`}

/* Редактор. Пока один пользователь: доступ по коду, правки лежат в воркере синхронизации тафсиров.
   Когда появятся аккаунты, как в библиотеке Таухид, код заменит вход, а блок останется тем же. */
const SYNC='https://tafsir-sync.qaadiy-tafsir.workers.dev/v1/';
const ED={code:rd('edcode',''),on:!!rd('edcode',''),all:rd('edits',{})};
let SRC=null;
const toast=t=>{const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},2800)};
const mdi=s=>esc(s).replace(/\[\^(\w+)\]/g,'<sup>$1</sup>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/==(.+?)==/g,'<mark>$1</mark>');
const edGet=a=>{const r=ED.all[a];return r&&!r.del?r:null};
const edLive=a=>{const r=edGet(a);return r&&r.st!=='ok'?r:null};
const edA=a=>ED.on?` data-ed="${esc(a)}"`:'';
function pen(a){if(!ED.on)return '';const r=edGet(a);return `<button class="pen${r?(r.st==='ok'?' ok':' has'):''}" data-pen="${esc(a)}" aria-label="Править">✎</button>`}
const noteLine=a=>{const r=edGet(a);if(!ED.on||!r)return '';return `${r.note?`<div class="ednote">Замечание: ${esc(r.note)}</div>`:''}${r.reply?`<div class="ednote">Ответ: ${esc(r.reply)}</div>`:''}`};
const edTitle=(a,t)=>{const r=ED.on&&edLive(a);return r&&r.new!=null?r.new:t};
function edBlock(a,html){const r=ED.on&&edLive(a),body=r&&r.new!=null?r.new.split(/\n\s*\n/).map(mdi).join('<br><br>'):html;
 return `<p${edA(a)}${r&&r.new!=null?' class="edited"':''}>${body}${pen(a)}</p>${noteLine(a)}`}
const edCount=()=>Object.values(ED.all).filter(r=>!r.del&&r.st!=='ok').length;
const edBar=()=>`<div class="edbar"><span id="edn">Режим редактора. Открытых правок: ${edCount()}</span><span><a href="#/questions">Вопросы</a> · <a href="#/edits">Правки</a></span></div>`;
function edSource(a){if(!SRC)return null;const p=a.split('/'),[,,x]=p;
 if(x==='ch'){const c=SRC.ch[+p[3]];if(!c)return null;return p[4]==='t'?c.t:c[p[4]][+p[5]]}
 const h=SRC.h[x];if(!h)return null;return p[3]==='t'?h.t:h[p[3]][+p[4]]}
function openSheet(a,noteOnly,text){const r=edGet(a),src=noteOnly?text:edSource(a),cur=r&&r.new!=null?r.new:src;
 $('sheet').innerHTML=`<h3>${noteOnly?'Замечание':'Правка'}</h3>
 ${!noteOnly&&r&&r.new!=null?`<div class="orig">Было: ${esc(src)}</div>`:''}${noteOnly&&src?`<div class="orig">${esc(src.slice(0,240))}</div>`:''}
 ${noteOnly?'':`<label for="edt">Текст</label><textarea id="edt">${escP(cur??'')}</textarea>`}
 <label for="edn2">Замечание для Claude, можно только его</label><textarea id="edn2" class="nt">${escP(r?r.note||'':'')}</textarea>
 <div class="row"><button class="btn pri" data-edsave="${esc(a)}">Сохранить</button><button class="btn" data-edclose>Отмена</button>${r?`<button class="more" data-eddel="${esc(a)}">Убрать правку</button>`:''}</div>`;
 $('sheet').dataset.src=src??'';$('sheet').hidden=false;$('scrim').hidden=false}
async function edSync(){if(!ED.code)return false;
 try{const blob=await fetch(SYNC+ED.code).then(r=>r.json());const remote=blob.edits||{};let dirty=false;
  for(const k in ED.all)if(!remote[k]||ED.all[k].at>remote[k].at)dirty=true;
  const merged={...remote};for(const k in ED.all)if(!merged[k]||ED.all[k].at>merged[k].at)merged[k]=ED.all[k];
  ED.all=merged;wr('edits',merged);
  if(dirty){const r=await fetch(SYNC+ED.code,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({edits:merged})});if(!r.ok)throw 0}
  return true}catch{return false}}
async function edSave(a){const s=$('sheet'),t=$('edt'),note=$('edn2').value.trim(),src=s.dataset.src,txt=t?t.value.trim():null;
 const changed=t&&txt!==src.trim();if(!changed&&!note){hidePanels();return}
 ED.all[a]={old:src,new:changed?txt:null,note,at:new Date().toISOString(),st:'new'};wr('edits',ED.all);hidePanels();const y=scrollY;await route();scrollTo(0,y);
 toast(await edSync()?'Сохранено':'Сохранено на этом устройстве, отправлю при связи')}
async function edDel(a){ED.all[a]={del:1,at:new Date().toISOString()};wr('edits',ED.all);hidePanels();const y=scrollY;await route();scrollTo(0,y);await edSync()}
async function editorEnter(code){bar('Редактор','#/');
 if(code==='off'){wr('edcode','');ED.code='';ED.on=false;view.innerHTML='<div class="empty">Режим редактора выключен на этом устройстве.</div>';return}
 ED.code=code;ED.on=true;wr('edcode',code);await edSync();history.replaceState(null,'','#/');route();toast('Режим редактора включён')}
async function editsPage(){bar('Правки','#/');if(!ED.on)return notfound();await edSync();
 const rows=Object.entries(ED.all).filter(([,r])=>!r.del).sort((a,b)=>b[1].at.localeCompare(a[1].at));
 const osn=await J('data/osnovy.json').catch(()=>[]),QX=await qIndex().catch(()=>({all:[]}));
 const link=a=>{const p=a.split('/');if(p[0]==='q'){const q=QX.all.find(x=>x.id===p[1]);return q?`#/${q.a[0]}/q-${q.id}`:'#/questions'}return p[0]==='sharh'?(()=>{const[c,n]=p[1].split('-'),t=CFG.articles.find(x=>x.k===p[1]),o=osn.find(x=>x.k===p[1]);return t?`#/${c}/${t.b}/${n}`:o?`#/osnovy/${o.n}`:'#/'})():`#/${p[0]}/${p[1]}${/^\d/.test(p[2])?'/'+p[2]:''}`};
 view.innerHTML=`<div class="bk"><h2>Правки</h2></div><p class="intro">Открытых: ${edCount()}. Скажите Claude «забери правки», и он внесёт их в текст.</p>
 <ul class="list">${rows.map(([a,r])=>`<li><a href="${link(a)}"><span class="t">${esc(a)}<small>${r.new!=null?esc(r.new.slice(0,120)):''}${r.note?' Замечание: '+esc(r.note.slice(0,120)):''}${r.reply?' Ответ: '+esc(r.reply.slice(0,120)):''}</small></span><span class="c">${r.st==='ok'?'учтено':'открыто'}</span></a></li>`).join('')||'<li class="empty">Правок пока нет.</li>'}</ul>
 <p class="foot"><a href="#/editor/off">Выключить режим редактора на этом устройстве</a></p>`}

/* Настройки */
function srcPanel(){$('src').innerHTML=`<button class="xb" data-x aria-label="Закрыть">×</button><h3>Источники</h3><p>Что показывать под хадисом.</p>
 ${SOURCES.map(s=>`<label class="opt"><input type="checkbox" data-src="${s[0]}"${ST[s[0]]?' checked':''}><span><b>${s[1]}</b><small>${s[2]}</small></span></label>`).join('')}
 ${ED.on?`<div class="sz"><span>Режим редактора включён</span><a class="btn" href="#/questions" style="margin:0">Вопросы</a><a class="btn" href="#/edits" style="margin:0">Правки: ${edCount()}</a></div>`:''}<div class="sz"><span>Размер текста</span><button data-fs="-1" aria-label="Меньше">A−</button><button data-fs="1" aria-label="Больше">A+</button></div>`;
 $('src').hidden=false;$('scrim').hidden=false}

/* Навигация */
const pos={};
async function route(){hidePanels();
 const h=decodeURIComponent(location.hash.replace(/^#\/?/,'')),[a,b,c,d]=h.split('/');
 try{if(!CFG)CFG=await J('data/config.json');
  if(!a)home();else if(a==='r')await narratorPage(b);else if(a==='search')await searchPage(b||'');else if(a==='about')about();else if(a==='editor')await editorEnter(b);else if(a==='edits')await editsPage();
  else if(a==='osnovy'){if(b)await osnova(+b,c);else await osnovy()}else if(a==='questions')await questionsPage(b);
  else if(CFG.collections.some(x=>x.id===a)){if(b)await book(a,+b,c,d);else await shelf(a)}else notfound();
 }catch(e){console.error(e);view.innerHTML='<div class="empty">Не удалось загрузить данные. Проверьте соединение.<br><button class="btn" onclick="location.reload()">Обновить</button></div>'}
 if(!c)scrollTo(0,pos[location.hash]||0)}
history.scrollRestoration='manual';
addEventListener('scroll',()=>{pos[location.hash]=scrollY},{passive:true});
addEventListener('hashchange',route);
addEventListener('popstate',e=>{if(cardOn&&!(e.state&&e.state.card))hidePanels()});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(cardOn)history.back();else hidePanels()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.id!=='sf')return;e.preventDefault();const q=f.q.value.trim();if(q)location.hash='#/search/'+encodeURIComponent(q)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.oth&&d.open&&!d.dataset.ok){d.dataset.ok=1;fillOther(d)}},true);
document.addEventListener('change',e=>{const k=e.target.dataset.src;if(!k)return;ST[k]=e.target.checked;wr(k,ST[k]);const y=scrollY;route().then(()=>{srcPanel();scrollTo(0,y)})});
document.addEventListener('click',e=>{const t=e.target.closest('[data-ask],[data-pen],[data-edsave],[data-eddel],[data-edclose],[data-id],[data-open],[data-link],[data-ar],[data-x],[data-fs],#srcb,#scrim');if(!t)return;
 if(t.dataset.ask)openAsk(t.dataset.ask);
 else if(t.dataset.pen){e.preventDefault();e.stopPropagation();const box=t.closest('[data-ed]');openSheet(t.dataset.pen,'note'in box.dataset,'note'in box.dataset?box.textContent.replace('✎','').trim():null)}
 else if(t.dataset.edsave)edSave(t.dataset.edsave);
 else if(t.dataset.eddel)edDel(t.dataset.eddel);
 else if('edclose'in t.dataset)hidePanels();
 else if(t.dataset.id){e.preventDefault();openCard(+t.dataset.id)}
 else if('open'in t.dataset){t.previousElementSibling.classList.add('on');t.remove()}
 else if(t.dataset.link){const u=location.href.split('#')[0]+t.dataset.link;navigator.clipboard&&navigator.clipboard.writeText(u).then(()=>{t.textContent='Ссылка скопирована';setTimeout(()=>{t.textContent='Скопировать ссылку'},1800)})}
 else if('ar'in t.dataset){ST.ar=true;wr('ar',true);route()}
 else if(t.dataset.fs){ST.fs=Math.min(24,Math.max(15,ST.fs+ +t.dataset.fs));wr('fs',ST.fs);fontApply()}
 else if(t.id==='srcb')srcPanel();
 else if(cardOn)history.back();else hidePanels()});
route();
if(ED.on){edSync();addEventListener('online',edSync)}
if('serviceWorker'in navigator){if(location.search.includes('nosw=1')){navigator.serviceWorker.getRegistration().then(r=>r&&r.unregister());caches.keys().then(k=>k.filter(n=>n.startsWith('hd-')).forEach(n=>caches.delete(n)))}
 else navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
